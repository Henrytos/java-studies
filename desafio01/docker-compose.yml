services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservasdb
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/reservasdb
      DB_USER: reservas
      DB_PASS: reservas
    depends_on:
      - postgres

volumes:
  postgres_data:
